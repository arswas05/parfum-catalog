<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог La Parfum</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        #search { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        #catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { border: 1px solid #eee; padding: 10px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 250px; object-fit: contain; margin-bottom: 10px; background: #fff;}
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #222; word-wrap: break-word; flex-grow: 1;}
        .card .price { font-weight: bold; color: #d9534f; font-size: 18px; }
        .error { color: red; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Каталог La Parfum</h1>
    <input type="text" id="search" placeholder="Начните вводить название или бренд...">
    <div id="catalog">
        <p style="text-align:center; width:100%;">Загрузка данных...</p>
    </div>
</div>

<script>
    // Добавляем ?v=3, чтобы браузер не кэшировал старый файл
    const csvFilePath = 'data.csv?v=3'; 

    let allPerfumes = [];

    fetch(csvFilePath)
        .then(response => {
            if (!response.ok) throw new Error('Файл не найден');
            return response.text();
        })
        .then(csvText => {
            const rows = csvText.split('\n').filter(row => row.trim() !== '');
            
            // Пропускаем первую строку (шапку)
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                // Простой способ разделить строку CSV (учитывая кавычки)
                const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || row.split(',');
                
                if (cols.length >= 3) {
                    let price = cols[0].replace(/"/g, '').trim();
                    let imgUrl = cols[1].replace(/"/g, '').trim();
                    let title = cols[2].replace(/"/g, '').trim();

                    if (title.length > 2) {
                        allPerfumes.push({ price: price, imgUrl: imgUrl, title: title });
                    }
                }
            }
            renderCatalog(allPerfumes);
        })
        .catch(error => {
            document.getElementById('catalog').innerHTML = `<p class="error">Ошибка: ${error.message}. Убедитесь, что файл data.csv загружен.</p>`;
        });

    function renderCatalog(items) {
        const container = document.getElementById('catalog');
        container.innerHTML = '';
        
        if (items.length === 0) {
            container.innerHTML = '<p style="text-align:center; width:100%;">Ничего не найдено.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Если картинки нет или она не грузится, показываем заглушку
            const imgHtml = item.imgUrl && item.imgUrl.startsWith('http') 
                ? `<img src="${item.imgUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">` 
                : `<div style="height:250px; display:flex; align-items:center; justify-content:center; background:#ddd;">Нет фото</div>`;

            card.innerHTML = `
                ${imgHtml}
                <h3>${item.title}</h3>
                <div class="price">${item.price}</div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allPerfumes.filter(item => item.title.toLowerCase().includes(query));
        renderCatalog(filtered);
    });
</script>

</body>
</html>
