<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог La Parfum</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        #search { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        #catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { border: 1px solid #eee; padding: 10px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 250px; object-fit: contain; margin-bottom: 10px; background: #fff;}
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #222; word-wrap: break-word; flex-grow: 1;}
        .card .price { font-weight: bold; color: #d9534f; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Каталог La Parfum</h1>
    <input type="text" id="search" placeholder="Начните вводить название или бренд...">
    <div id="catalog">
        <p style="text-align:center; width:100%;">Загрузка данных...</p>
    </div>
</div>

<script>
    // v=99, чтобы браузер точно не кэшировал старый файл
    const csvFilePath = 'data.csv?v=99'; 

    let allPerfumes = [];

    fetch(csvFilePath)
        .then(response => response.text())
        .then(csvText => {
            const lines = csvText.split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // Ищем ссылку на картинку (она начинается на http)
                let urlMatch = line.match(/https?:\/\/[^,]+/);
                if (!urlMatch) continue;
                
                let imgUrl = urlMatch[0].replace(/"/g, ''); // Очищаем от кавычек
                
                // Разделяем строку на две части: до ссылки и после ссылки
                let parts = line.split(imgUrl);
                
                // В части ДО ссылки лежит цена (с пробелами и кавычками)
                let rawPrice = parts[0].replace(/"/g, '').replace(/,/g, ' ').trim();
                // Убираем ВСЕ пробелы из цены, чтобы "3 950" стало "3950"
                let price = rawPrice.replace(/\s+/g, ''); 
                
                // В части ПОСЛЕ ссылки лежит название
                let title = parts[1] ? parts[1].replace(/"/g, '').replace(/^,/, '').trim() : 'Неизвестный товар';

                // Если цена вообще пустая, ставим прочерк
                if (!price) price = "0"; 

                allPerfumes.push({ price: price, imgUrl: imgUrl, title: title });
            }
            
            renderCatalog(allPerfumes);
        })
        .catch(error => {
            document.getElementById('catalog').innerHTML = `<p style="text-align:center; color:red;">Ошибка загрузки данных.</p>`;
        });

    function renderCatalog(items) {
        const container = document.getElementById('catalog');
        container.innerHTML = '';
        
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <img src="${item.imgUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                <h3>${item.title}</h3>
                <div class="price">${item.price} ₽</div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allPerfumes.filter(item => item.title.toLowerCase().includes(query));
        renderCatalog(filtered);
    });
</script>

</body>
</html>
