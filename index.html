<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог La Parfum</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        #search { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        #catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { border: 1px solid #eee; padding: 10px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 250px; object-fit: contain; margin-bottom: 10px; background: #fff;}
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #222; word-wrap: break-word; flex-grow: 1;}
        .card .price { font-weight: bold; color: #d9534f; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Каталог La Parfum</h1>
    <input type="text" id="search" placeholder="Начните вводить название или бренд...">
    <div id="catalog">
        <p style="text-align:center; width:100%;">Загрузка данных...</p>
    </div>
</div>

<script>
    // v=100, чтобы браузер точно скачал новый код
    const csvFilePath = 'data.csv?v=100'; 

    // 🚀 СЛОВАРЬ ЗАМЕН: Слева то, как пишет парсер, справа — как будет на сайте
    const brandFixes = {
        "DИOR": "Dior",
        "Dиor": "Dior",
        "DR ": "Dior ",
        "Versac.": "Versace",
        "Versac ": "Versace ",
        "KLN ": "Kilian ",
        "TF ": "Tom Ford ",
        "T.F. ": "Tom Ford ",
        "CHNL ": "Chanel ",
        "CH ": "Carolina Herrera ",
        "P.R. ": "Paco Rabanne ",
        "PR ": "Paco Rabanne ",
        "ARMN ": "Armani ",
        "LV ": "Louis Vuitton ",
        "MFK ": "Maison Francis Kurkdjian ",
        "YSЛ ": "YSL ",
        "YSL ": "YSL ",
        "BRDO ": "Byredo ",
        "lacost. ": "Lacoste ",
        "Mont. ": "Montale ",
        "CRИИD ": "Creed ",
        "CRD ": "Creed ",
        "Init. ": "Initio ",
        "Initиo ": "Initio ",
        "Rich. ": "Richard ",
        "Att. Coll. ": "Attar Collection ",
        "Att Coll ": "Attar Collection ",
        "LNVN ": "Lanvin ",
        "HERM. ": "Hermes ",
        "MAB ": "Marc-Antoine Barrois ",
        "Vilhelm parf. ": "Vilhelm Parfumerie ",
        "Vilhel. parf. ": "Vilhelm Parfumerie ",
        "DG ": "Dolce & Gabbana ",
        "GCC ": "Gucci ",
        "Gvnch ": "Givenchy ",
        "Manc. ": "Mancera ",
        "XERJ. ": "Xerjoff ",
        "BLGR ": "Bvlgari ",
        "kenz. ": "Kenzo ",
        "Ex nihиlo ": "Ex Nihilo ",
        "Ex Nihilo ": "Ex Nihilo ",
        "Zielin. ": "Zielinski & Rozen ",
        "L LB ": "Le Labo ",
        "Esc. Molecules ": "Escentric Molecules ",
        "Tiziana T. ": "Tiziana Terenzi ",
        "Penhalig. ": "Penhaligon's ",
        "Penhal. ": "Penhaligon's ",
        "Franc B ": "Franck Boclet ",
        "MOSCHIN. ": "Moschino ",
        "Moschin. ": "Moschino ",
        "Clin. ": "Clinique ",
        "Ajm. ": "Ajmal ",
        "Chopar. ": "Chopard ",
        "Roj. ": "Roja ",
        "Kaджal ": "Kajal ",
        "Jimmи ": "Jimmy Choo ",
        "Armaф ": "Armaf ",
        "Bill. Elish ": "Billie Eilish ",
        "Jo Mal. ": "Jo Malone ",
        "C for Men ": "Clive Christian ",
        "Initиo ": "Initio ",
        "Шейх ": "Shaik ",
        "Клив ": "Clive Christian ",
        "Floraиku ": "Floraïku ",
        "Vertu. ": "Vertus ",
        "Tiff. & Co ": "Tiffany & Co ",
        "Tiff. ": "Tiffany ",
        "P. D. Marl. ": "Parfums de Marly ",
        "P.D.M. ": "Parfums de Marly ",
        "Mancer. ": "Mancera "
    };

    let allPerfumes = [];

    fetch(csvFilePath)
        .then(response => response.text())
        .then(csvText => {
            const lines = csvText.split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let urlMatch = line.match(/https?:\/\/[^,]+/);
                if (!urlMatch) continue;
                
                let imgUrl = urlMatch[0].replace(/"/g, ''); 
                let parts = line.split(imgUrl);
                
                let rawPrice = parts[0].replace(/"/g, '').replace(/,/g, ' ').trim();
                let price = rawPrice.replace(/\s+/g, ''); 
                
                let title = parts[1] ? parts[1].replace(/"/g, '').replace(/^,/, '').trim() : 'Неизвестный товар';

                // ✨ МАГИЯ ЗАМЕНЫ БРЕНДОВ ✨
                for (const [badName, goodName] of Object.entries(brandFixes)) {
                    // Разбиваем строку на части по badName и склеиваем с goodName
                    title = title.split(badName).join(goodName);
                }

                if (!price) price = "0"; 

                allPerfumes.push({ price: price, imgUrl: imgUrl, title: title });
            }
            
            renderCatalog(allPerfumes);
        })
        .catch(error => {
            document.getElementById('catalog').innerHTML = `<p style="text-align:center; color:red;">Ошибка загрузки данных.</p>`;
        });

    function renderCatalog(items) {
        const container = document.getElementById('catalog');
        container.innerHTML = '';
        
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <img src="${item.imgUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                <h3>${item.title}</h3>
                <div class="price">${item.price} ₽</div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allPerfumes.filter(item => item.title.toLowerCase().includes(query));
        renderCatalog(filtered);
    });
</script>

</body>
</html>
